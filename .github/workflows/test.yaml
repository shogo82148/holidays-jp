name: Test
on: [push, pull_request]
jobs:
  test-updater:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "updater/go.mod"
          cache-dependency-path: "updater/go.sum"

      - name: Test
        run: go test -race -v -coverprofile=profile.cov ./...
        working-directory: updater

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: profile.cov
          parallel: true
          flag-name: updater
          working-directory: updater

  test-holidays-api:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "holidays-api/go.mod"
          cache-dependency-path: "holidays-api/go.mod"

      - name: Test
        run: go test -race -v -coverprofile=profile.cov ./...
        working-directory: holidays-api

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: profile.cov
          parallel: true
          flag-name: holidays-api
          working-directory: holidays-api

  finish:
    if: "always()"
    needs:
      - test-updater
      - test-holidays-api
    runs-on: ubuntu-latest
    steps:
      - name: finish
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          parallel-finished: true
