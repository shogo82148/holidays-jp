name: Test
on: [push, pull_request]
jobs:
  test-updater:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "updater/go.mod"
          cache-dependency-path: "updater/go.sum"

      - name: Test
        run: go test -race -v -coverprofile=profile.cov ./...
        working-directory: updater

      - name: Send coverage
        uses: shogo82148/actions-goveralls@4b30166c2ac96ac557328a27874a16b777f9b8bd # v1.11.4
        with:
          path-to-profile: profile.cov
          parallel: true
          flag-name: updater
          working-directory: updater

  test-holidays-api:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "holidays-api/go.mod"
          cache-dependency-path: "holidays-api/go.mod"

      - name: Test
        run: go test -race -v -coverprofile=profile.cov ./...
        working-directory: holidays-api

      - name: Send coverage
        uses: shogo82148/actions-goveralls@4b30166c2ac96ac557328a27874a16b777f9b8bd # v1.11.4
        with:
          path-to-profile: profile.cov
          parallel: true
          flag-name: holidays-api
          working-directory: holidays-api

  finish:
    if: "always()"
    needs:
      - test-updater
      - test-holidays-api
    runs-on: ubuntu-latest
    steps:
      - name: finish
        uses: shogo82148/actions-goveralls@4b30166c2ac96ac557328a27874a16b777f9b8bd # v1.11.4
        with:
          parallel-finished: true
