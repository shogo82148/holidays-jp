name: Update
on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "updater/go.mod"
          cache-dependency-path: "updater/go.sum"

      - name: Update syukujitsu.csv
        run: go run main.go
        working-directory: updater

      - name: Generate token
        id: token
        uses: shogo82148/actions-github-app-token@v1.3.4
        with:
          permission-contents: write
          permission-pull-requests: write

      - name: commit
        uses: shogo82148/actions-commit-and-create-pr@v1.1.4
        with:
          github-token: ${{ steps.token.outputs.token }}
          commit-message: "update syukujitsu.csv"
